name: TEST — Bybit kline reachability (temporary, delete after use)

# Manual trigger only — deliberately no `schedule:` and no `push:` trigger,
# so this never runs on its own and never clutters Actions history the way
# the old push-triggered mvs-scan.yml issue did. Run it once from the
# Actions tab ("Run workflow"), read the result, then delete this file
# and test-bybit-klines.js — this is not part of the live strategy.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install axios
        run: npm install axios --no-save

      - name: Run Bybit kline reachability test
        run: node test-bybit-klines.js
